AWSTemplateFormatVersion: "2010-09-09"

Resources:

  # IAM Role
  LiveVideoStreamingComputeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

  # IAM Instance Profile
  LiveVideoStreamingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref LiveVideoStreamingComputeRole

Outputs:
  LiveVideoStreamingInstanceProfileName:
    Description: EC2 Instance profile name for the streaming EC2 instance
    Value: !Ref LiveVideoStreamingInstanceProfile
